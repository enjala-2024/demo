<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Trip Planner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
        }

        header {
            text-align: center;
            padding: 30px;
        }

        header h1 {
            font-size: 45px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        .container {
            width: 85%;
            margin: auto;
            margin-top: 30px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box input {
            padding: 12px;
            width: 250px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .search-box button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #ff9800;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        .features {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            color: black;
            width: 280px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            border-radius: 15px;
            height: 180px;
            object-fit: cover;
        }

        .card h2 {
            margin-top: 15px;
            color: #1e3c72;
        }

        .card p {
            margin-top: 10px;
            font-size: 15px;
        }

        .card button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #1e3c72;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .card button:hover {
            background: #2a5298;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <h1>🌍 Instant Trip Planner</h1>
        <p>Plan your perfect journey in seconds</p>
    </header>

    <div class="container">

        <div class="search-box">
            <input type="text" placeholder="Enter Destination">
            <input type="date">
            <button>Plan Trip</button>
        </div>

        <div class="features">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                    alt="Beach">
                <h2>Beach Trips</h2>
                <p>Discover beautiful beaches and relaxing destinations.</p>
                <button>Explore</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                    alt="Mountains">
                <h2>Mountain Adventures</h2>
                <p>Find amazing hill stations and trekking spots.</p>
                <button>Explore</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d"
                    alt="City">
                <h2>City Tours</h2>
                <p>Explore famous cities, attractions, and food spots.</p>
                <button>Explore</button>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Instant Trip Planner </p>
    </footer>

</body>

</html>
